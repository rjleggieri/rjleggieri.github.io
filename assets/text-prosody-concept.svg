<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Text and voice comparison concept</title><desc id="desc">A conceptual diagram of text-derived sentiment and voice-derived affect being mapped into a shared valence-arousal representation. This diagram is illustrative, not study data.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 H 0 V 40" fill="none" stroke="#163f36" stroke-opacity=".055"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#b85b27"/></marker></defs>
<rect width="1200" height="760" fill="#f3e9dc"/><rect width="1200" height="760" fill="url(#grid)"/>
<style>text{font-family:Arial,sans-serif;fill:#173b33}.over{font-size:17px;font-weight:700;letter-spacing:3px;fill:#9d481f}.title{font-size:44px;font-weight:700;letter-spacing:-1px}.sub{font-size:22px;fill:#52655b}.label{font-size:25px;font-weight:700}.small{font-size:20px;fill:#52655b}.mono{font-family:Consolas,monospace;font-size:20px}.white{fill:#f8f5ec}.wire{fill:none;stroke:#b85b27;stroke-width:4;marker-end:url(#arrow)}.line{stroke:#173b33;stroke-opacity:.17;stroke-width:2}</style><text x="70" y="78" class="over">TEXT + SPEECH / EXPLORATORY RESEARCH</text><text x="70" y="145" class="title">Two signals. One comparison.</text>
<rect x="70" y="210" width="480" height="210" rx="14" fill="#fffdf6" stroke="#c9d1c5"/><text x="105" y="258" class="over">TEXT-DERIVED SENTIMENT</text><text x="105" y="323" style="font:italic 48px Georgia,serif">“I’m fine.”</text><path d="M105 371H390M105 389H300" stroke="#93a58f" stroke-width="5"/>
<rect x="650" y="210" width="480" height="210" rx="14" fill="#173f35"/><text x="685" y="258" class="over" style="fill:#f4bc8d">AUDIO-DERIVED PROSODY</text><g stroke="#efb388" stroke-width="10" stroke-linecap="round"><path d="M704 323V345M736 304V364M768 288V380M800 313V355M832 322V346M864 307V361M896 295V373M928 315V353M960 325V343M992 311V357M1024 321V347M1056 327V341"/></g>
<path d="M310 421V460H550V497M890 421V460H650V497" class="wire"/><rect x="265" y="520" width="670" height="133" rx="14" fill="#dce5d5"/><text x="305" y="570" class="label">Shared valence–arousal representation</text><text x="305" y="613" class="small">Compare model-derived outputs / ADS</text><text x="70" y="714" class="small">Conceptual illustration · not a plot of study observations</text></svg>