<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Leakage-aware model evaluation workflow</title><desc id="desc">Related records stay in grouped splits before calibration and comparison. Text component evidence, audio runtime checks, and synthetic verification remain distinct.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 H 0 V 40" fill="none" stroke="#163f36" stroke-opacity=".055"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#b85b27"/></marker></defs>
<rect width="1200" height="760" fill="#eef1e9"/><rect width="1200" height="760" fill="url(#grid)"/>
<style>text{font-family:Arial,sans-serif;fill:#173b33}.over{font-size:17px;font-weight:700;letter-spacing:3px;fill:#9d481f}.title{font-size:44px;font-weight:700;letter-spacing:-1px}.sub{font-size:22px;fill:#52655b}.label{font-size:25px;font-weight:700}.small{font-size:20px;fill:#52655b}.mono{font-family:Consolas,monospace;font-size:20px}.white{fill:#f8f5ec}.wire{fill:none;stroke:#b85b27;stroke-width:4;marker-end:url(#arrow)}.line{stroke:#173b33;stroke-opacity:.17;stroke-width:2}</style><text x="70" y="78" class="over">TEXT-PROSODY-EVIDENCE / PYTHON</text><text x="70" y="145" class="title">Make the evaluation inspectable.</text>
<g transform="translate(70 210)"><rect width="310" height="275" rx="14" fill="#fffdf6" stroke="#c9d1c5"/><text x="25" y="43" class="over">01 / GROUP</text><g fill="#8ca98c"><circle cx="55" cy="103" r="15"/><circle cx="95" cy="103" r="15"/><circle cx="135" cy="103" r="15"/></g><g fill="#b65c35"><circle cx="55" cy="148" r="15"/><circle cx="95" cy="148" r="15"/></g><g fill="#4c7b85"><circle cx="55" cy="193" r="15"/><circle cx="95" cy="193" r="15"/><circle cx="135" cy="193" r="15"/></g><text x="180" y="109" class="small">source A</text><text x="180" y="154" class="small">source B</text><text x="180" y="199" class="small">source C</text><text x="25" y="246" class="small">Keep related records together</text></g>
<path d="M388 345H430" class="wire"/><g transform="translate(445 210)"><rect width="310" height="275" rx="14" fill="#173f35"/><text x="25" y="43" class="over" style="fill:#f4bc8d">02 / EVALUATE</text><path d="M35 200V86M35 200H275" stroke="#bbd1bb" stroke-width="2" fill="none"/><path d="M42 189 91 164 141 138 192 110 255 83" fill="none" stroke="#efb388" stroke-width="5"/><text x="25" y="246" class="small white">Grouped folds · calibration</text></g>
<path d="M764 345H806" class="wire"/><g transform="translate(820 210)"><rect width="310" height="275" rx="14" fill="#fffdf6" stroke="#c9d1c5"/><text x="25" y="43" class="over">03 / DOCUMENT</text><path d="M35 95H265M35 138H245M35 181H220" stroke="#8ca98c" stroke-width="12"/><text x="25" y="246" class="small">Metrics · provenance · limits</text></g>
<line x1="70" y1="543" x2="1130" y2="543" class="line"/><text x="70" y="590" class="label">Different checks. Explicit evidence boundaries.</text><text x="70" y="641" class="small">Text: component evidence</text><text x="490" y="641" class="small">Audio: runtime checks</text><text x="70" y="685" class="small">Cross-modal pipeline: synthetic verification</text></svg>