<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">BQE CORE data connector architecture</title><desc id="desc">Read-only BQE API access feeds incremental ingestion, a validated SQLite warehouse, and traceable reporting exports.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 H 0 V 40" fill="none" stroke="#163f36" stroke-opacity=".055"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#b85b27"/></marker></defs>
<rect width="1200" height="760" fill="#eef1e9"/><rect width="1200" height="760" fill="url(#grid)"/>
<style>text{font-family:Arial,sans-serif;fill:#173b33}.over{font-size:17px;font-weight:700;letter-spacing:3px;fill:#9d481f}.title{font-size:44px;font-weight:700;letter-spacing:-1px}.sub{font-size:22px;fill:#52655b}.label{font-size:25px;font-weight:700}.small{font-size:20px;fill:#52655b}.mono{font-family:Consolas,monospace;font-size:20px}.white{fill:#f8f5ec}.wire{fill:none;stroke:#b85b27;stroke-width:4;marker-end:url(#arrow)}.line{stroke:#173b33;stroke-opacity:.17;stroke-width:2}</style><text x="70" y="78" class="over">BQE CORE / DATA INTEGRATION</text><text x="70" y="145" class="title">From business records to usable context.</text>
<rect x="70" y="208" width="1060" height="92" rx="14" fill="#173f35"/><text x="102" y="247" class="label white">BQE CORE API</text><text x="102" y="278" class="small white">Projects · time entries · financial records</text><rect x="842" y="234" width="254" height="39" rx="19" fill="#d9e5cf"/><text x="870" y="260" class="mono">GET / read:core</text>
<path d="M320 301V351" class="wire"/><rect x="70" y="365" width="500" height="160" rx="14" fill="#fffdf6" stroke="#c9d1c5"/><text x="100" y="410" class="over">01 / INGEST</text><text x="100" y="455" class="label">Permission-aware sync</text><text x="100" y="493" class="small">Pagination · retries · checkpoints</text>
<rect x="630" y="365" width="500" height="160" rx="14" fill="#fffdf6" stroke="#c9d1c5"/><text x="660" y="410" class="over">02 / VALIDATE</text><text x="660" y="455" class="label">Auditable SQLite warehouse</text><text x="660" y="493" class="small">Raw evidence · deduplication · checks</text><path d="M570 445H617" class="wire"/>
